services:
  mysql:
    image: mysql:8.4
    container_name: credit_card_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: credit_card_db
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uappuser", "-papppassword"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    container_name: credit_card_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  django:
    build:
      context: ./backend/django_backend
    container_name: credit_card_django
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend/django_backend:/app
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,django
      MYSQL_DATABASE: credit_card_db
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      DJANGO_INTERNAL_SECRET: ${DJANGO_INTERNAL_SECRET:?Set DJANGO_INTERNAL_SECRET in .env}
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      DJANGO_INTERNAL_URL: http://django:8000
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      EMAIL_HOST: mailpit
      EMAIL_PORT: "1025"
      EMAIL_HOST_USER: "${EMAIL_HOST_USER:-}"
      EMAIL_HOST_PASSWORD: "${EMAIL_HOST_PASSWORD:-}"
      EMAIL_USE_TLS: "False"
      DEFAULT_FROM_EMAIL: "${DEFAULT_FROM_EMAIL:-PaySecure <no-reply@example.com>}"
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started

  fastapi:
    build:
      context: ./backend/fastapi_payment
    container_name: credit_card_fastapi
    environment:
      DJANGO_INTERNAL_URL: http://django:8000
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_INTERNAL_SECRET: ${DJANGO_INTERNAL_SECRET:?Set DJANGO_INTERNAL_SECRET in .env}
      FASTAPI_PORT: "8001"
    ports:
      - "8001:8001"
    depends_on:
      - django

  frontend:
    build:
      context: ./frontend
    container_name: credit_card_frontend
    environment:
      VITE_DJANGO_URL: http://localhost:8000
      VITE_FASTAPI_URL: http://localhost:8001
    ports:
      - "5173:5173"
    depends_on:
      - django
      - fastapi

volumes:
  mysql_data:
